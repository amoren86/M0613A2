<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ca">
<head th:replace="~{fragments/template :: head}">
	<!-- Static Preview fallback -->
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
	<link rel="stylesheet"
		href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
	<title>Login - Medicine Stock</title>
</head>
<body class="m-4 bg-light text-dark">
	<div class="container">
		<!-- Header fragment -->
		<header th:replace="~{fragments/template :: header}"
			class="mb-4 p-4 bg-white border border-secondary-subtle rounded shadow-sm">
			<p class="display-4 fw-bold mb-1 text-dark">
				Medicine Stock
			</p>
			<p class="h5 text-secondary mb-0 fw-normal">
				By Institut Marianao
			</p>
		</header>

		<div class="row justify-content-center">
			<div class="col-md-5">
				<div class="card border border-secondary-subtle shadow-sm p-4 bg-white rounded">
					<h2 class="h4 fw-bold text-dark mb-3">Authentication Required</h2>

					<!-- Error alert when credentials are invalid -->
					<div th:if="${param.error}" class="alert alert-danger py-2" role="alert">
						Invalid username or password.
					</div>

					<!-- Info alert after logging out -->
					<div th:if="${param.logout}" class="alert alert-secondary py-2" role="alert">
						You have been logged out successfully.
					</div>

					<form th:action="@{/login}" method="post">
						<div class="mb-3">
							<label for="username" class="form-label fw-semibold">Username</label>
							<input type="text" id="username" name="username" class="form-control"
								placeholder="Enter username" required autofocus />
						</div>

						<div class="mb-4">
							<label for="password" class="form-label fw-semibold">Password</label>
							<input type="password" id="password" name="password" class="form-control"
								placeholder="Enter password" required />
						</div>

						<div class="d-grid gap-2">
							<button type="submit" class="btn btn-dark">Sign In</button>
							<a th:href="@{/medicines/all}" class="btn btn-outline-secondary">Back to Catalog</a>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
