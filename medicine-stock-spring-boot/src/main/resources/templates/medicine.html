<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ca">
<head th:replace="~{fragments/template :: head}">
    <!-- Static Preview fallback -->
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <link rel="stylesheet"
    	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <title>Medicines</title>
</head>
<body class="m-4">
	<div class="container">
		<!-- Header fragment -->
		<header th:replace="~{fragments/template :: header}" class="mb-4 p-4 bg-white border border-secondary-subtle rounded shadow-sm">
			<p class="display-4 fw-bold mb-1 text-dark">
				Medicine Stock
			</p>
			<p class="h5 text-secondary mb-0 fw-normal">
				By Institut Marianao
			</p>
		</header>

		<!-- Detail Card in Monochromatic Style -->
		<div class="card border border-secondary-subtle shadow-sm p-4 bg-white rounded">
			<div class="row g-3">
				<h2 class="h3 fw-bold text-dark mb-1" th:text="${medicine.name}">Paracetamol 1g</h2>
				<p class="text-secondary mb-3" th:text="${medicine.description}">Analgesic and antipyretic medication.</p>
				
				<dl class="row g-2 mb-4">
					<dt class="col-sm-3 fw-bold text-dark">Code:</dt>
					<dd class="col-sm-9 text-secondary" th:text="${medicine.id}">MED-001</dd>
					
					<dt class="col-sm-3 fw-bold text-dark">Lab:</dt>
					<dd class="col-sm-9 text-secondary" th:text="${medicine.producer}">Bayer AG</dd>
					
					<dt class="col-sm-3 fw-bold text-dark">Category:</dt>
					<dd class="col-sm-9 text-secondary" th:text="${medicine.category}">Analgesic</dd>
					
					<dt class="col-sm-3 fw-bold text-dark">Stock:</dt>
					<dd class="col-sm-9 text-secondary" th:text="${medicine.stockQuantity}">150</dd>
					
					<dt class="col-sm-3 fw-bold text-dark">Price:</dt>
					<dd class="col-sm-9 text-secondary" th:text="${medicine.price + '€'}">3.50€</dd>
				</dl>
				
				<div class="col-12">
					<!-- Standard Thymeleaf URL expression replacing spring:url -->
					<a href="javascript:history.back()" class="btn btn-outline-secondary px-4">go back</a>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
