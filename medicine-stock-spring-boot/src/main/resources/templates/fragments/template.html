<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ca">
<!-- Head fragment definition -->
<head th:fragment="head">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <link rel="stylesheet"
    	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet"
    	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <title th:text="${title != null} ? ${title} : 'Medicine Stock'">Medicine Stock</title>
</head>
<body class="m-4">
	<div class="container">
		<!-- Header fragment definition -->
		<header th:fragment="header" class="mb-4 p-5 bg-secondary-subtle bg-gradient rounded">
			<p class="display-1">
				<strong>Medicine Stock</strong>
			</p>
			<h3>
				By Institut Marianao
			</h3>
		</header>
	</div>
</body>
</html>
