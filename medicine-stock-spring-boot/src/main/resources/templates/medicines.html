<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ca">
<head th:replace="~{fragments/template :: head}">
    <!-- Static Preview fallback -->
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <link rel="stylesheet"
    	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <title>Medicine Catalog</title>
</head>
<body class="m-4 bg-light text-dark">
	<div class="container">
		<!-- Header fragment -->
		<header th:replace="~{fragments/template :: header}" class="mb-4 p-4 bg-white border border-secondary-subtle rounded shadow-sm">
			<p class="display-4 fw-bold mb-1 text-dark">
				Medicine Stock
			</p>
			<p class="h5 text-secondary mb-0 fw-normal">
				By Institut Marianao
			</p>
		</header>

		<!-- Main Content Card -->
		<div class="card border border-secondary-subtle shadow-sm p-4 bg-white rounded">
			<div class="d-flex justify-content-between align-items-center mb-4">
				<h2 class="h3 fw-bold text-dark mb-0">Medicine Catalog</h2>
				<a th:href="@{/}" class="btn btn-outline-secondary btn-sm">Home</a>
			</div>

			<!-- Data Table -->
			<div class="table-responsive">
				<table class="table table-hover align-middle border border-secondary-subtle">
					<thead class="table-light">
						<tr>
							<th scope="col">Code</th>
							<th scope="col">Name</th>
							<th scope="col">Producer</th>
							<th scope="col">Category</th>
							<th scope="col" class="text-end">Stock</th>
							<th scope="col" class="text-end">Price</th>
							<th scope="col" class="text-center">Actions</th>
						</tr>
					</thead>
					<tbody>
						<!-- th:each iterates over the medicines list -->
						<tr th:each="med : ${medicines}">
							<td class="fw-bold text-dark" th:text="${med.id}">MED-001</td>
							<td th:text="${med.name}">Paracetamol 1g</td>
							<td class="text-secondary" th:text="${med.producer}">Bayer AG</td>
							<td class="text-secondary" th:text="${med.category}">Analgesic</td>
							<td class="text-end" th:text="${med.stockQuantity}">150</td>
							<td class="text-end fw-semibold" th:text="${med.price + '€'}">3.50€</td>
							<td class="text-center">
								<a th:href="@{/repository-example/medicine/{id}(id=${med.id})}" class="btn btn-sm btn-outline-dark">View Details</a>
							</td>
						</tr>
						<!-- Empty state row if no elements -->
						<tr th:if="${#lists.isEmpty(medicines)}">
							<td colspan="7" class="text-center text-muted py-4">No medicines available in stock.</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>
</body>
</html>
