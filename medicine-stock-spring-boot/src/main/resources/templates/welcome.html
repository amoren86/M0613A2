<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ca">
<head th:replace="~{fragments/template :: head}">
    <!-- Static Preview fallback -->
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <link rel="stylesheet"
    	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <title>Medicine Stock</title>
</head>
<body class="m-4">
	<div class="container">
		<!-- Replaces header element with the 'header' fragment inside fragments/template.html -->
		<header th:replace="~{fragments/template :: header}" class="mb-4 p-5 bg-secondary-subtle bg-gradient rounded">
			<p class="display-1">
				<strong>Medicine Stock</strong>
			</p>
			<h3>
				By Institut Marianao
			</h3>
		</header>
		
		<div class="card border-0 shadow-sm mb-4">
			<div class="card-body p-4 border-start border-4 border-secondary rounded-start">
				<!-- th:text replaces HTML content with model variable welcomeMsg -->
				<h2 class="h3 text-secondary mb-2" th:text="${welcomeMsg}">Welcome to Medicine Stock!!</h2>
				<!-- th:text replaces paragraph content with model variable tagline -->
				<p class="text-muted mb-0" th:text="${tagline}">Efficient and centralized management of pharmaceutical inventory.</p>
			</div>
		</div>
	</div>
</body>
</html>
