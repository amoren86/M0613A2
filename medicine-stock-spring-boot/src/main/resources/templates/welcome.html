<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ca">
<head th:replace="~{fragments/template :: head}">
	<!-- Static Preview fallback -->
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
	<link rel="stylesheet"
		href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
	<title>Medicine Stock</title>
</head>
<body class="m-4 bg-light text-dark">
	<div class="container">
		<!-- Replaces header element with the 'header' fragment inside fragments/template.html -->
		<header th:replace="~{fragments/template :: header}"
			class="mb-4 p-4 bg-white border border-secondary-subtle rounded shadow-sm">
			<p class="display-4 fw-bold mb-1 text-dark">
				Medicine Stock
			</p>
			<p class="h5 text-secondary mb-0 fw-normal">
				By Institut Marianao
			</p>
		</header>

		<!-- Main Content Card -->
		<div class="card border border-secondary-subtle shadow-sm p-4 bg-white rounded">
			<div class="d-flex justify-content-between align-items-center mb-3">
				<!-- th:text replaces HTML content with model variable welcomeMsg -->
				<h2 class="h3 fw-bold text-dark mb-0" th:text="${welcomeMsg}">Welcome
					to Medicine Stock!!</h2>
				<a th:href="@{/medicines}" class="btn btn-outline-secondary btn-sm">Medicine Catalog</a>
			</div>
			<!-- th:text replaces paragraph content with model variable tagline -->
			<p class="text-secondary mb-0" th:text="${tagline}">Efficient and
				centralized management of pharmaceutical inventory.</p>
		</div>
	</div>
</body>
</html>
