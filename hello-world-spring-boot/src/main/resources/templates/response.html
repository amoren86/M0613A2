<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ca">
<head th:replace="~{sections/head :: head}">
    <!-- Static Preview fallback: Standard CSS link for browser double-click preview -->
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <link rel="stylesheet"
    	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <title>Hello World Spring Boot</title>
</head>
<body class="m-4">
	<div class="container">
		<!-- Static Preview fallback: Displays this header when opened directly in browser.
		     In Spring Boot, th:replace substitutes this element with sections/header.html -->
		<header th:replace="~{sections/header :: header}" class="mb-4 p-5 bg-secondary-subtle bg-gradient rounded">
			<p class="display-1">
				<strong>Hello World Spring Boot</strong>
			</p>
			<h3>
				By Institut Marianao
			</h3>
		</header>
		
		<!-- Static Preview fallback: Displays default text when opened directly in browser.
		     In Spring Boot, th:text overrides this content with the ${greetings} model variable -->
		<h1 th:text="'Greetings: ' + ${greetings}">Greetings: static preview hello all!!</h1>
	</div>
</body>
</html>
